spring.application.name=nexus-comply-cyber
spring.data.mongodb.uri=mongodb://localhost:27017/nexuscomply
spring.data.mongodb.auto-index-creation=true
server.port=8080

# ==========================================
# AI Unknown-Syntax Suggestion Provider (Gemini)
# ==========================================
nexus.ai.provider=${NEXUS_AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
gemini.api.timeout-seconds=${GEMINI_API_TIMEOUT_SECONDS:10}
