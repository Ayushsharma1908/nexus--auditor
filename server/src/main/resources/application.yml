server:
  port: ${PORT:8080}

spring:
  application:
    name: nexus-comply-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server/.env[.properties]
      - optional:file:client/.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../server/.env[.properties]
      - optional:file:../client/.env[.properties]
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/nexus_comply}}
      database: ${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DATABASE:nexus_comply}}
      auto-index-creation: true

# AI Unknown-Syntax Suggestion Provider (Gemini / Stub)
nexus:
  ai:
    provider: ${NEXUS_AI_PROVIDER:gemini}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-1.5-flash}
    timeout-seconds: ${GEMINI_API_TIMEOUT_SECONDS:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.nexuscomply: INFO
