## Juniper Junos Hardened Set Configuration
set system host-name core-junos-01
set system services ssh protocol-version v2
delete system services telnet
set system services web-management https
set system authentication-order [ radius tacplus ]
set system syslog host 10.200.1.50 any notice
set system ntp server 10.200.1.1
set system login message "AUTHORIZED PERSONNEL ONLY"
set system login password minimum-length 14