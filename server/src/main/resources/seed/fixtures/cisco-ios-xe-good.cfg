! Cisco IOS XE Hardened Production Configuration
hostname edge-router-01
version 17.9
service password-encryption
security passwords min-length 14
!
aaa new-model
aaa authentication login default group tacacs+ local
!
ip ssh version 2
ip domain-name corp.nexuscomply.local
no ip http server
ip http secure-server
!
logging host 10.200.1.50
logging trap informational
!
ntp server 10.200.1.1
!
banner motd ^AUTHORIZED USERS ONLY. ALL ACTIVITY MONITORED.^
!
line vty 0 4
 transport input ssh
 transport preferred none
 exec-timeout 10 0
line aux 0
 transport input none
!
end